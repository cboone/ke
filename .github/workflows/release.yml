name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: amd64
          - target: aarch64-apple-darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BINARY="ke"
          cargo build --release --target ${{ matrix.target }}
          tar -czf "${BINARY}-${VERSION}-darwin-${{ matrix.arch }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" "${BINARY}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-darwin-${{ matrix.arch }}
          path: "*.tar.gz"

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum ./*.tar.gz > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            checksums.txt
          generate_release_notes: true

  update-tap:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download checksums from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern checksums.txt

      - name: Extract SHA256 values
        id: checksums
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          AMD64_SHA=$(grep -F "ke-${VERSION}-darwin-amd64.tar.gz" checksums.txt | awk '{print $1}')
          ARM64_SHA=$(grep -F "ke-${VERSION}-darwin-arm64.tar.gz" checksums.txt | awk '{print $1}')
          if [ -z "$AMD64_SHA" ] || [ -z "$ARM64_SHA" ]; then
            echo "::error::Failed to extract SHA256 values from checksums.txt"
            cat checksums.txt
            exit 1
          fi
          echo "amd64=${AMD64_SHA}" >> "$GITHUB_OUTPUT"
          echo "arm64=${ARM64_SHA}" >> "$GITHUB_OUTPUT"

      - name: Generate formula and update tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not set"
            exit 1
          fi

          VERSION="${{ steps.version.outputs.version }}"
          AMD64_SHA="${{ steps.checksums.outputs.amd64 }}"
          ARM64_SHA="${{ steps.checksums.outputs.arm64 }}"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/cboone/homebrew-tap.git" tap-repo
          mkdir -p tap-repo/Formula

          sed \
            -e "s/VERSION_PLACEHOLDER/${VERSION}/g" \
            -e "s/SHA256_FOR_DARWIN_AMD64/${AMD64_SHA}/g" \
            -e "s/SHA256_FOR_DARWIN_ARM64/${ARM64_SHA}/g" \
            Formula/ke.rb > tap-repo/Formula/ke.rb

          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ke.rb
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ke ${VERSION}"
            git push
          fi
