name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: amd64
          - target: aarch64-apple-darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BINARY="ke"
          cargo build --release --target ${{ matrix.target }}
          tar -czf "${BINARY}-${VERSION}-darwin-${{ matrix.arch }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" "${BINARY}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-${{ matrix.arch }}
          path: "*.tar.gz"

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum ./*.tar.gz > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            checksums.txt
          generate_release_notes: true

  update-tap:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download checksums from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern checksums.txt

      - name: Extract SHA256 values
        id: checksums
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          AMD64_SHA=$(grep "ke-${VERSION}-darwin-amd64.tar.gz" checksums.txt | awk '{print $1}')
          ARM64_SHA=$(grep "ke-${VERSION}-darwin-arm64.tar.gz" checksums.txt | awk '{print $1}')
          if [ -z "$AMD64_SHA" ] || [ -z "$ARM64_SHA" ]; then
            echo "::error::Failed to extract SHA256 values from checksums.txt"
            cat checksums.txt
            exit 1
          fi
          echo "amd64=${AMD64_SHA}" >> "$GITHUB_OUTPUT"
          echo "arm64=${ARM64_SHA}" >> "$GITHUB_OUTPUT"

      - name: Generate formula and update tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          AMD64_SHA="${{ steps.checksums.outputs.amd64 }}"
          ARM64_SHA="${{ steps.checksums.outputs.arm64 }}"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/cboone/homebrew-tap.git" tap-repo
          mkdir -p tap-repo/Formula

          cat > tap-repo/Formula/ke.rb <<FORMULA_EOF
          class Ke < Formula
            desc "A developer-focused CLI for ergonomic macOS Keychain access"
            homepage "https://github.com/cboone/ke"
            version "${VERSION}"
            license "MIT"

            depends_on :macos

            on_intel do
              url "https://github.com/cboone/ke/releases/download/v${VERSION}/ke-${VERSION}-darwin-amd64.tar.gz"
              sha256 "${AMD64_SHA}"
            end

            on_arm do
              url "https://github.com/cboone/ke/releases/download/v${VERSION}/ke-${VERSION}-darwin-arm64.tar.gz"
              sha256 "${ARM64_SHA}"
            end

            def install
              bin.install "ke"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ke --version")
            end
          end
          FORMULA_EOF

          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ke.rb
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ke ${VERSION}"
            git push
          fi
